[project]
name = "cloud-arbitrage-orchestrator"
version = "0.1.0"
description = "Multi-cloud FinOps engine that evaluates spot instance pricing and generates IaC for workload migration."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chetan Raju" }]
keywords = ["finops", "multi-cloud", "kubernetes", "terraform", "spot-instances"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
cloud-arb = "cloud_arb.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "W291", "W293", "W292"]
